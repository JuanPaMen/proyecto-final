# Publica el frontend (carpeta frontend/) en GitHub Pages cada vez que se
# actualiza la rama main. También se puede lanzar a mano desde la pestaña Actions.
name: Desplegar frontend en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: frontend

      - name: Compilar
        run: npm run build
        working-directory: frontend
        env:
          # Se configuran en GitHub: Settings > Secrets and variables > Actions > Variables
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WHATSAPP: ${{ vars.VITE_WHATSAPP }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
